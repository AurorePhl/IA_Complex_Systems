<!DOCTYPE html>
<html>

<head>
    <!-- Lien vers la feuille de style externe (CSS) pour le design de la page -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Lien vers le script JavaScript qui gère la logique de la simulation -->
    <script src="js/simulation.js"></script>
    
    <!-- Définition du jeu de caractères utilisé dans la page (UTF-8) -->
    <meta charset="UTF-8">
    
    <!-- Permet à la page d'être responsive, s'adaptant aux différentes tailles d'écrans -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Titre de la page, visible dans l'onglet du navigateur -->
    <title>Simulation d'incendie</title>
</head>

<body>

    <!-- Conteneur principal qui organise la mise en page de la simulation -->
    <div class="main-container">
        
        <!-- Div centrale contenant la grille SVG de la simulation -->
        <div class="container">
            <!-- Grille SVG qui représente visuellement la simulation d'incendie -->
            <svg id="grid" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <!-- Div pour la légende et les paramètres de la simulation -->
        <div class="legend">
            <!-- Titre principal de la page -->
            <h1 id="title">Simulation d'incendie</h1>

            <!-- Titre pour la section des légendes des symboles -->
            <h2>Légendes : </h2>
            <!-- Liste des éléments de la légende qui expliquent les symboles dans la grille -->
            <ul>
                <!-- Élément de légende pour l'incendie (carré rouge) -->
                <li>
                    <span class="legend-item">
                        <svg width="20" height="20">
                            <rect width="20" height="20" fill="red" />
                        </svg>
                        <span>Incendie</span>
                    </span>
                </li>
                <!-- Élément de légende pour le Quartier Général (QG) (carré gris) -->
                <li>
                    <span class="legend-item">
                        <svg width="20" height="20">
                            <rect width="20" height="20" fill="#bfbfbf" />
                        </svg>
                        <span>Quartier Général (QG)</span>
                    </span>
                </li>
                <!-- Élément de légende pour un survivant (triangle vert) -->
                <li>
                    <span class="legend-item">
                        <svg width="20" height="20">
                            <polygon points="10,0 0,20 20,20" fill="green" />
                        </svg>
                        <span>Humain</span>
                    </span>
                </li>
                <!-- Élément de légende pour un robot (cercles) -->
                <li>
                    <span class="legend-item">
                        <svg width="20" height="20">
                            <circle cx="10" cy="10" r="5" fill="red" />
                        </svg>
                        <svg width="20" height="20">
                            <circle cx="10" cy="10" r="5" fill="orange" />
                        </svg>
                        <svg width="20" height="20">
                            <circle cx="10" cy="10" r="5" fill="yellow" />
                        </svg>
                        <svg width="20" height="20">
                            <circle cx="10" cy="10" r="5" fill="green" />
                        </svg>
                        <svg width="20" height="20">
                            <circle cx="10" cy="10" r="5" fill="blue" />
                        </svg>
                        <svg width="20" height="20">
                            <circle cx="10" cy="10" r="5" fill="pink" />
                        </svg>
                        <svg width="20" height="20">
                            <circle cx="10" cy="10" r="5" fill="violet" />
                        </svg>
                        <span>Robot</span>
                    </span>
                </li>
            </ul>

            <!-- Titre pour la section des paramètres de simulation -->
            <h2>Paramètres : </h2>
            
            <!-- Div pour l'affichage et la gestion des robots -->
            <div>
                <!-- Bouton pour supprimer un robot -->
                <button id="removeRobot">-</button>
                <!-- Affichage du nombre actuel de robots dans la simulation -->
                <span id="robotCount">Total robots : 7</span>
                <!-- Bouton pour ajouter un robot -->
                <button id="addRobot">+</button>
            </div>

            <!-- Div pour l'affichage et la gestion des survivants -->
            <div>
                <!-- Affichage du nombre actuel de survivants dans la simulation -->
                <span id="humansCount">Total humains : 0</span>
                <!-- Bouton pour ajouter un humain -->
                <button id="addHuman">+</button>
                <span id="humansInDanger">Humains en danger : 0</span>
                <span id="survivantsCount">Humains sauvés : 0</span>
            </div>
            
            <!-- Div pour ajuster la vitesse des robots -->
            <div>
                <!-- Affichage du texte de la vitesse des robots -->
                <div id="robotSpeed">Vitesse des robots : </div>
                <!-- Contrôle pour définir la vitesse des robots (valeur numérique avec un pas de 0.1) -->
                <input type="number" id="robotSpeedPara" step="0.1" value="0.5">
                <!-- Affichage du texte pour l'unité de la vitesse (secondes) -->
                <span id="speedDisplay"> secondes</span>
            </div>
        </div>
    </div>

</body>

</html>
